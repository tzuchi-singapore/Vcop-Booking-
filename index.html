<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>VCOP Booking Studio</title>
<!-- Supabase JS (optional persistence). App runs fine without it. -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --navy:#13293D; --navy-700:#1c3a54; --navy-900:#0e2030;
  --amber:#C08A2D; --amber-600:#a8781f;
  --slate:#5B6570; --muted:#8a93a0;
  --paper:#F7F8FA; --card:#ffffff; --line:#E6E9ED; --line-2:#d7dce2;
  --ink:#13293D; --white:#fff;
  --danger:#C0392B; --success:#2E7D5B;
  --shadow:0 10px 30px rgba(19,41,61,.10);
  --shadow-lg:0 24px 60px rgba(19,41,61,.18);
  --radius:16px; --radius-sm:11px;
  --font:'Poppins','Segoe UI',system-ui,-apple-system,Roboto,"Helvetica Neue",Arial,"PingFang SC","Microsoft YaHei",sans-serif;
}
@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap');
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{font-family:var(--font);background:var(--paper);color:var(--ink);line-height:1.55;overflow-x:hidden}
img{max-width:100%;display:block}
button{font-family:inherit;cursor:pointer;border:none;background:none}
input,textarea,select{font-family:inherit;font-size:16px}
a{color:inherit;text-decoration:none}
.hidden{display:none !important}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;
  padding:14px 22px;border-radius:12px;font-weight:600;font-size:15px;transition:.18s;border:1px solid transparent;white-space:nowrap}
.btn-primary{background:var(--amber);color:#fff;box-shadow:0 6px 18px rgba(192,138,45,.35)}
.btn-primary:hover{background:var(--amber-600);transform:translateY(-1px)}
.btn-navy{background:var(--navy);color:#fff}
.btn-navy:hover{background:var(--navy-700);transform:translateY(-1px)}
.btn-ghost{background:#fff;color:var(--navy);border:1px solid var(--line-2)}
.btn-ghost:hover{border-color:var(--navy);background:#fff}
.btn-danger{background:#fff;color:var(--danger);border:1px solid #ecc7c3}
.btn-danger:hover{background:var(--danger);color:#fff}
.btn-block{width:100%}
.btn-sm{padding:9px 14px;font-size:13px;border-radius:9px}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none}

/* ---------- top bar ---------- */
.topbar{position:sticky;top:0;z-index:50;background:rgba(255,255,255,.92);backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;
  padding:12px 20px;gap:12px}
.brand{display:flex;align-items:center;gap:11px;min-width:0}
.brand-logo{height:38px;width:auto;display:block;cursor:pointer;-webkit-user-select:none;user-select:none}
.secret-dot{width:26px;height:26px;border-radius:7px;flex:0 0 auto;cursor:pointer;
  background:linear-gradient(135deg,var(--navy),var(--navy-700));position:relative}
.secret-dot::after{content:"";position:absolute;left:7px;top:7px;width:8px;height:8px;border-radius:2px;background:var(--amber)}
.brand-name{font-weight:800;letter-spacing:.5px;color:var(--navy);font-size:19px;line-height:1}
.brand-sub{font-size:9px;letter-spacing:3px;color:var(--slate);font-weight:600;margin-top:2px}
.top-actions{display:flex;align-items:center;gap:8px}
.lang-toggle{display:flex;border:1px solid var(--line-2);border-radius:999px;overflow:hidden;background:#fff}
.lang-toggle button{padding:7px 13px;font-size:13px;font-weight:600;color:var(--slate)}
.lang-toggle button.active{background:var(--navy);color:#fff}

/* ---------- layout ---------- */
.wrap{max-width:1120px;margin:0 auto;padding:0 20px}
.view{min-height:calc(100vh - 60px)}
.section{padding:64px 0}
.eyebrow{color:var(--amber);font-weight:700;font-size:13px;letter-spacing:2px;margin:0 0 10px}
h1,h2,h3{color:var(--navy);margin:0}
.display{font-size:clamp(34px,6vw,62px);font-weight:800;line-height:1.05;letter-spacing:-1px}
.h2{font-size:clamp(26px,4vw,40px);font-weight:800;letter-spacing:-.5px}

/* ---------- hero ---------- */
.hero{position:relative;background:
  radial-gradient(1200px 500px at 80% -10%, rgba(192,138,45,.14), transparent 60%),
  linear-gradient(160deg,#fff 0%, #eef1f5 100%);
  overflow:hidden;border-bottom:1px solid var(--line)}
.hero-grid{display:grid;grid-template-columns:1.15fr .85fr;gap:40px;align-items:center;padding:74px 0}
.hero p.lead{font-size:18px;color:var(--slate);max-width:44ch;margin:18px 0 28px}
.hero-cta{display:flex;gap:12px;flex-wrap:wrap}
.hero-visual{position:relative;aspect-ratio:1/1;border-radius:24px;overflow:hidden;box-shadow:var(--shadow-lg);
  background:linear-gradient(135deg,var(--navy),var(--navy-900))}
.hero-visual .grid-lines{position:absolute;inset:0;opacity:.5;
  background-image:linear-gradient(rgba(255,255,255,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.06) 1px,transparent 1px);
  background-size:44px 44px}
.hv-badge{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;color:#fff;text-align:center;padding:30px}
.hv-mark{width:110px;height:110px;border:6px solid #fff;border-radius:26px;position:relative}
.hv-mark::before{content:"";position:absolute;left:18px;bottom:18px;width:34px;height:34px;border-radius:8px;background:var(--amber)}
.hv-mark::after{content:"";position:absolute;right:18px;top:18px;width:34px;height:34px;border-radius:8px;background:#fff}
.hv-badge h3{color:#fff;font-size:26px}
.hv-badge span{color:#c8d2dc;font-size:13px;letter-spacing:2px}
.stat-row{display:flex;gap:26px;margin-top:30px;flex-wrap:wrap}
.stat b{display:block;font-size:30px;color:var(--navy);font-weight:800;line-height:1}
.stat span{font-size:12.5px;color:var(--slate)}

/* ---------- services ---------- */
.svc-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:30px}
.svc{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:24px;transition:.2s}
.svc:hover{box-shadow:var(--shadow);transform:translateY(-3px);border-color:var(--line-2)}
.svc .ic{width:44px;height:44px;border-radius:11px;background:rgba(19,41,61,.06);display:flex;align-items:center;justify-content:center;margin-bottom:14px;font-size:22px}
.svc h3{font-size:17px;margin-bottom:6px}
.svc p{margin:0;color:var(--slate);font-size:14px}

/* ---------- about strip ---------- */
.about{background:var(--navy);color:#fff}
.about h2{color:#fff}
.about .lead{color:#c3ccd6;max-width:60ch}
.about-facts{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:28px}
.fact{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.12);border-radius:14px;padding:18px}
.fact b{color:var(--amber);font-size:22px;display:block}
.fact span{color:#c3ccd6;font-size:13px}

/* ---------- contact ---------- */
.contact-grid{display:grid;grid-template-columns:1fr 1fr;gap:26px;margin-top:30px}
.info-card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:26px}
.info-row{display:flex;gap:14px;align-items:flex-start;padding:13px 0;border-bottom:1px solid var(--line)}
.info-row:last-child{border-bottom:none}
.info-row .ic{width:38px;height:38px;flex:0 0 auto;border-radius:10px;background:rgba(192,138,45,.12);color:var(--amber);display:flex;align-items:center;justify-content:center;font-size:18px}
.info-row .lbl{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:1px}
.info-row .val{font-weight:600;color:var(--navy);font-size:15px}
.socials{display:flex;gap:10px;margin-top:18px}
.soc{width:44px;height:44px;border-radius:11px;display:flex;align-items:center;justify-content:center;
  background:var(--navy);color:#fff;font-weight:700;transition:.18s}
.soc:hover{background:var(--amber);transform:translateY(-2px)}
.map-card{border-radius:var(--radius);overflow:hidden;border:1px solid var(--line);min-height:340px;background:#e9edf1}
.map-card iframe{width:100%;height:100%;min-height:340px;border:0;display:block}

/* ---------- footer ---------- */
.footer{background:var(--navy-900);color:#aeb9c4;padding:34px 0;font-size:13.5px}
.footer .wrap{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;align-items:center}

/* ---------- auth / modals ---------- */
.overlay{position:fixed;inset:0;background:rgba(14,32,48,.55);backdrop-filter:blur(3px);z-index:100;
  display:flex;align-items:center;justify-content:center;padding:18px}
.modal{background:#fff;border-radius:20px;box-shadow:var(--shadow-lg);width:100%;max-width:440px;
  padding:30px;max-height:92vh;overflow:auto;animation:pop .2s ease}
.modal.wide{max-width:760px}
@keyframes pop{from{transform:scale(.96);opacity:0}to{transform:scale(1);opacity:1}}
.modal h2{font-size:22px;margin-bottom:4px}
.modal .sub{color:var(--slate);font-size:14px;margin-bottom:20px}
.field{margin-bottom:15px}
.field label{display:block;font-size:13px;font-weight:600;color:var(--navy);margin-bottom:6px}
.field input,.field textarea,.field select{width:100%;padding:12px 14px;border:1px solid var(--line-2);border-radius:11px;
  background:#fbfcfd;transition:.15s;color:var(--ink)}
.field input:focus,.field textarea:focus,.field select:focus{outline:none;border-color:var(--amber);background:#fff;box-shadow:0 0 0 3px rgba(192,138,45,.14)}
.field textarea{resize:vertical;min-height:90px}
.modal-x{position:absolute;top:16px;right:18px;font-size:26px;color:var(--muted);line-height:1;background:none}
.err{background:#fdece9;color:var(--danger);padding:10px 13px;border-radius:10px;font-size:13.5px;margin-bottom:14px;border:1px solid #f4ccc5}
.ok{background:#e8f5ee;color:var(--success);padding:10px 13px;border-radius:10px;font-size:13.5px;margin-bottom:14px;border:1px solid #bfe3cf}

/* ---------- dashboard ---------- */
.dash{padding:26px 0 70px}
.dash-head{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:22px}
.dash-head h1{font-size:26px}
.dash-head .who{color:var(--slate);font-size:14px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:22px;margin-bottom:18px;box-shadow:var(--shadow)}
.panel h2{font-size:18px;margin-bottom:14px;display:flex;align-items:center;gap:8px}

/* calendar */
.cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.cal-head .mname{font-weight:700;font-size:17px;color:var(--navy)}
.cal-nav{display:flex;gap:8px}
.cal-nav button{width:38px;height:38px;border-radius:10px;border:1px solid var(--line-2);background:#fff;color:var(--navy);font-size:17px;font-weight:700}
.cal-nav button:hover{border-color:var(--navy)}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.cal-dow{text-align:center;font-size:11px;font-weight:700;color:var(--muted);padding:6px 0;text-transform:uppercase;letter-spacing:.5px}
.cal-cell{aspect-ratio:1/1;border:1px solid var(--line);border-radius:10px;display:flex;flex-direction:column;
  align-items:center;justify-content:center;font-weight:600;color:var(--navy);cursor:pointer;position:relative;transition:.12s;font-size:15px;background:#fff}
.cal-cell:hover:not(.disabled){border-color:var(--amber);background:#fffdf8}
.cal-cell.empty{border:none;background:none;cursor:default}
.cal-cell.disabled{color:var(--line-2);cursor:not-allowed;background:#fafbfc}
.cal-cell.blocked{background:#fdeee6;color:#c98b6b;cursor:not-allowed;border-color:#f2d9cc}
.cal-cell.past{color:#c4ccd4;cursor:not-allowed;background:#fafbfc}
.cal-cell.today{border-color:var(--navy);border-width:2px}
.cal-cell.selected{background:var(--navy);color:#fff;border-color:var(--navy)}
.cal-cell .dot{width:6px;height:6px;border-radius:50%;background:var(--amber);position:absolute;bottom:7px}
.cal-cell.selected .dot{background:#fff}
.legend{display:flex;gap:16px;flex-wrap:wrap;margin-top:14px;font-size:12.5px;color:var(--slate)}
.legend i{width:12px;height:12px;border-radius:3px;display:inline-block;margin-right:5px;vertical-align:-1px}

/* time wheel picker */
.picker{display:flex;gap:10px;justify-content:center;align-items:center;margin:6px 0 4px}
.wheel{position:relative;width:96px;height:150px;overflow:hidden;border:1px solid var(--line-2);border-radius:14px;background:#fbfcfd}
.wheel .band{position:absolute;left:0;right:0;top:56px;height:38px;border-top:1px solid var(--amber);border-bottom:1px solid var(--amber);
  background:rgba(192,138,45,.07);pointer-events:none;z-index:1}
.wheel-scroll{position:absolute;inset:0;overflow-y:scroll;scroll-snap-type:y mandatory;scrollbar-width:none;text-align:center}
.wheel-scroll::-webkit-scrollbar{display:none}
.wheel-item{height:38px;line-height:38px;scroll-snap-align:center;font-size:20px;font-weight:600;color:var(--muted);transition:.1s}
.wheel-item.mid{color:var(--navy);font-size:23px}
.wheel-pad{height:56px}
.wheel-colon{font-size:26px;font-weight:800;color:var(--navy)}
.picked-time{text-align:center;font-size:15px;color:var(--slate);margin-top:6px}
.picked-time b{color:var(--navy);font-size:19px}

/* booking list */
.bk{display:flex;gap:14px;align-items:center;padding:14px;border:1px solid var(--line);border-radius:13px;margin-bottom:10px;background:#fff;transition:.15s;cursor:pointer}
.bk:hover{border-color:var(--amber);box-shadow:var(--shadow)}
.bk .date-chip{flex:0 0 auto;width:58px;text-align:center;background:var(--navy);color:#fff;border-radius:10px;padding:8px 0}
.bk .date-chip b{display:block;font-size:20px;line-height:1}
.bk .date-chip span{font-size:10px;letter-spacing:1px;text-transform:uppercase}
.bk .bk-body{flex:1;min-width:0}
.bk .bk-body .t{font-weight:700;color:var(--navy)}
.bk .bk-body .r{color:var(--slate);font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bk .tag{font-size:11px;font-weight:700;padding:4px 9px;border-radius:999px}
.tag-confirmed{background:#e8f5ee;color:var(--success)}
.tag-signed{background:rgba(192,138,45,.14);color:var(--amber-600)}
.empty-state{text-align:center;color:var(--muted);padding:34px 10px;font-size:14px}

/* signature */
.sigwrap{border:2px dashed var(--line-2);border-radius:14px;background:#fff;position:relative;overflow:hidden}
.sigwrap canvas{width:100%;height:200px;display:block;touch-action:none;cursor:crosshair}
.sig-hint{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:14px;pointer-events:none}

/* admin tables */
.table{width:100%;border-collapse:collapse;font-size:13.5px}
.table th{text-align:left;padding:10px;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.5px;border-bottom:2px solid var(--line)}
.table td{padding:11px 10px;border-bottom:1px solid var(--line);color:var(--ink);vertical-align:middle}
.table tr:hover td{background:#fbfcfd}
.tabs{display:flex;gap:6px;margin-bottom:18px;flex-wrap:wrap}
.tab{padding:10px 16px;border-radius:10px;font-weight:600;font-size:14px;color:var(--slate);background:#fff;border:1px solid var(--line)}
.tab.active{background:var(--navy);color:#fff;border-color:var(--navy)}
.mini{font-size:12px;color:var(--muted)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.chip{display:inline-block;background:#eef1f5;color:var(--navy);border-radius:999px;padding:3px 10px;font-size:12px;font-weight:600}

/* toast */
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(20px);opacity:0;
  background:var(--navy);color:#fff;padding:13px 20px;border-radius:12px;font-size:14px;font-weight:500;z-index:200;
  box-shadow:var(--shadow-lg);transition:.25s;max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.ok{background:var(--success)} .toast.err{background:var(--danger)}

.cfg-banner{background:#fff8ec;border-bottom:1px solid #f0e0c0;color:#8a6d2f;font-size:12.5px;padding:8px 16px;text-align:center}

@media(max-width:820px){
  .hero-grid{grid-template-columns:1fr;gap:26px;padding:44px 0}
  .hero-visual{max-width:340px;margin:0 auto}
  .svc-grid{grid-template-columns:1fr 1fr}
  .contact-grid{grid-template-columns:1fr}
  .about-facts{grid-template-columns:1fr}
  .grid2{grid-template-columns:1fr}
  .section{padding:48px 0}
}
@media(max-width:560px){
  .svc-grid{grid-template-columns:1fr}
  .table-scroll{overflow-x:auto}
}
</style>
</head>

/* ---------- 3. STORAGE LAYER ---------- */
let sb = null, CLOUD = false;
const STORE = { clients:[], bookings:[], blocks:[] };

async function initStorage(){
  if(CONFIG.SUPABASE_URL && CONFIG.SUPABASE_ANON_KEY && window.supabase){
    try{
      sb = window.supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_ANON_KEY);
      const [c,b,k] = await Promise.all([
        sb.from('clients').select('*'),
        sb.from('bookings').select('*'),
        sb.from('blocks').select('*')
      ]);
      if(!c.error) STORE.clients = c.data||[];
      if(!b.error) STORE.bookings = b.data||[];
      if(!k.error) STORE.blocks = k.data||[];
      CLOUD = true;
    }catch(e){ console.warn("Supabase init failed, using local memory:", e); CLOUD=false; }
  }
  if(!CLOUD) seedDemo();
  showCfgBanner();
}
function seedDemo(){
  if(STORE.clients.length===0){
    STORE.clients.push({id:uid(), username:"demo", password:"demo123",
      name:"Demo Client", phone:"+65 9000 0000", email:"demo@vcop.com.sg", created_at:now()});
  }
}
function showCfgBanner(){
  const el = document.getElementById('cfgBanner');
  if(!CLOUD){
    el.classList.remove('hidden');
    el.innerHTML = "Demo mode — data is kept for this session only. Add Supabase keys in CONFIG to save permanently. &nbsp;·&nbsp; Demo client: <b>demo / demo123</b>";
  } else el.classList.add('hidden');
}

// generic helpers to persist
async function dbInsert(table,row){
  STORE[table].push(row);
  if(CLOUD){ const {error}=await sb.from(table).insert(row); if(error)console.warn(error);}
}
async function dbUpdate(table,id,patch){
  const r = STORE[table].find(x=>x.id===id); if(r) Object.assign(r,patch);
  if(CLOUD){ const {error}=await sb.from(table).update(patch).eq('id',id); if(error)console.warn(error);}
}
async function dbDelete(table,id){
  STORE[table] = STORE[table].filter(x=>x.id!==id);
  if(CLOUD){ const {error}=await sb.from(table).delete().eq('id',id); if(error)console.warn(error);}
}
async function dbDeleteWhere(table,pred){
  const doomed = STORE[table].filter(pred);
  STORE[table] = STORE[table].filter(x=>!pred(x));
  if(CLOUD){ for(const d of doomed){ await sb.from(table).delete().eq('id',d.id);} }
}

/* ---------- 4. UTILITIES ---------- */
function uid(){ return 'id-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,8); }
function now(){ return new Date().toISOString(); }
function pad(n){ return String(n).padStart(2,'0'); }
function ymd(d){ return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
function parseYMD(s){ const [y,m,d]=s.split('-').map(Number); return new Date(y,m-1,d); }
function fmtDateLong(s){
  const d=parseYMD(s);
  const enM=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  const zhD=["日","一","二","三","四","五","六"];
  if(LANG==='zh') return `${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日 星期${zhD[d.getDay()]}`;
  const enD=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
  return `${enD[d.getDay()]}, ${d.getDate()} ${enM[d.getMonth()]} ${d.getFullYear()}`;
}
function toast(msg,type=''){
  const el=document.getElementById('toast');
  el.textContent=msg; el.className='toast show '+type;
  clearTimeout(el._t); el._t=setTimeout(()=>el.className='toast '+type,2600);
}
function esc(s){ return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }
function minutesOf(hhmm){ const [h,m]=hhmm.split(':').map(Number); return h*60+m; }
function addMin(hhmm,mins){ let x=minutesOf(hhmm)+mins; return pad(Math.floor(x/60))+':'+pad(x%60); }

/* ----- calendar ----- */
function mountCalendar(mountId, clientMode){
  const el=document.getElementById(mountId); if(!el) return;
  const first=new Date(CAL.year,CAL.month,1);
  const startDow=first.getDay();
  const daysIn=new Date(CAL.year,CAL.month+1,0).getDate();
  const today=new Date(); today.setHours(0,0,0,0);
  const enM=["January","February","March","April","May","June","July","August","September","October","November","December"];
  const zhM=["1月","2月","3月","4月","5月","6月","7月","8月","9月","10月","11月","12月"];
  const mname = LANG==='zh'? `${CAL.year}年 ${zhM[CAL.month]}` : `${enM[CAL.month]} ${CAL.year}`;
  const dowEn=["S","M","T","W","T","F","S"], dowZh=["日","一","二","三","四","五","六"];
  const dows=(LANG==='zh'?dowZh:dowEn);

  let cells='';
  for(let i=0;i<startDow;i++) cells+=`<div class="cal-cell empty"></div>`;
  for(let d=1;d<=daysIn;d++){
    const dateObj=new Date(CAL.year,CAL.month,d);
    const ds=ymd(dateObj);
    const isPast=dateObj<today;
    const isToday=ds===ymd(today);
    const wholeBlocked=STORE.blocks.some(b=>b.date===ds && !b.time);
    const hasMine=clientMode && STORE.bookings.some(b=>b.client_id===SESSION.client?.id && b.date===ds);
    let cls='cal-cell';
    if(isPast){cls+=' past';}
    else if(wholeBlocked){cls+=' blocked';}
    if(isToday) cls+=' today';
    if(CAL.selected===ds) cls+=' selected';
    const clickable=!isPast && !wholeBlocked;
    cells+=`<div class="${cls}" ${clickable?`onclick="selectDate('${ds}')"`:''}>${d}${hasMine?'<span class="dot"></span>':''}</div>`;
  }
  el.innerHTML=`
    <div class="cal-head">
      <div class="mname">${mname}</div>

/* ----- time wheel ----- */
function mountTimeWheel(mountId){
  const el=document.getElementById(mountId); if(!el) return;
  const hours=[]; for(let h=CONFIG.OPEN_HOUR;h<=CONFIG.CLOSE_HOUR;h++) hours.push(h);
  const mins=[0,15,30,45];
  el.innerHTML=`
    <div class="picker">
      <div class="wheel"><div class="band"></div>
        <div class="wheel-scroll" id="wH">
          <div class="wheel-pad"></div>
          ${hours.map(h=>`<div class="wheel-item" data-v="${h}">${pad(h)}</div>`).join('')}
          <div class="wheel-pad"></div>
        </div>
      </div>
      <div class="wheel-colon">:</div>
      <div class="wheel"><div class="band"></div>
        <div class="wheel-scroll" id="wM">
          <div class="wheel-pad"></div>
          ${mins.map(m=>`<div class="wheel-item" data-v="${m}">${pad(m)}</div>`).join('')}
          <div class="wheel-pad"></div>
        </div>
      </div>
    </div>
    <div class="picked-time">${t('time')}: <b id="pickedTime">${pad(PICK.h)}:${pad(PICK.m)}</b></div>`;
  setupWheel('wH', v=>{PICK.h=+v; updatePicked();});
  setupWheel('wM', v=>{PICK.m=+v; updatePicked();});
  // set initial scroll positions
  scrollWheelTo('wH', hours.indexOf(PICK.h));
  scrollWheelTo('wM', mins.indexOf(PICK.m));
}
function updatePicked(){ const e=document.getElementById('pickedTime'); if(e) e.textContent=pad(PICK.h)+':'+pad(PICK.m); }
function scrollWheelTo(id,idx){
  const sc=document.getElementById(id); if(!sc||idx<0) return;
  const ITEM=38;
  sc.scrollTop=idx*ITEM;
  highlightMid(sc);
}
function setupWheel(id,onPick){
  const sc=document.getElementById(id); if(!sc) return;
  const ITEM=38;
  let tmr=null;
  sc.addEventListener('scroll',()=>{
    highlightMid(sc);
    clearTimeout(tmr);
    tmr=setTimeout(()=>{
      const idx=Math.round(sc.scrollTop/ITEM);
      sc.scrollTo({top:idx*ITEM,behavior:'smooth'});
      const items=sc.querySelectorAll('.wheel-item');
      const chosen=items[idx];
      if(chosen) onPick(chosen.dataset.v);
    },90);
  },{passive:true});
}
function highlightMid(sc){
  const ITEM=38;
  const idx=Math.round(sc.scrollTop/ITEM);
  sc.querySelectorAll('.wheel-item').forEach((it,i)=>it.classList.toggle('mid',i===idx));
}

/* ----- confirm booking (with overlap check) ----- */
function confirmBooking(){
  if(!CAL.selected){ toast(t('chooseDateFirst'),'err'); return; }
  const reason=document.getElementById('reason').value.trim();
  if(!reason){ toast(t('enterReason'),'err'); return; }
  const time=pad(PICK.h)+':'+pad(PICK.m);
  // blocked exact slot?
  const slotBlocked=STORE.blocks.some(b=>b.date===CAL.selected && b.time===time);
  if(slotBlocked){ toast(LANG==='zh'?'该时间段已被封锁。':'That time slot is blocked.','err'); return; }
  // overlap detection
  const start=minutesOf(time), end=start+CONFIG.SLOT_MINUTES;
  const overlap=STORE.bookings.find(b=>{
    if(b.date!==CAL.selected) return false;
    const s=minutesOf(b.time), e=s+(b.duration||CONFIG.SLOT_MINUTES);
    return start<e && s<end;
  });
  if(overlap){ PENDING={reason,time,date:CAL.selected}; askOverlap(); return; }
  doBook(reason,time);
}

/* ----- signature pad ----- */
let sigCtx=null, sigDrawing=false, sigHasInk=false;
function setupSignature(b){
  const cv=document.getElementById('sigCanvas'); if(!cv) return;
  const wrap=document.getElementById('sigWrap');
  const ratio=window.devicePixelRatio||1;
  const w=wrap.clientWidth, h=200;
  cv.width=w*ratio; cv.height=h*ratio;
  sigCtx=cv.getContext('2d'); sigCtx.scale(ratio,ratio);
  sigCtx.lineWidth=2.4; sigCtx.lineCap='round'; sigCtx.lineJoin='round'; sigCtx.strokeStyle='#13293D';
  sigHasInk=false;
  // if already signed, load it
  if(b.signature){
    const img=new Image(); img.onload=()=>sigCtx.drawImage(img,0,0,w,h); img.src=b.signature;
    sigHasInk=true; hideHint();
  }
  const pos=e=>{
    const r=cv.getBoundingClientRect();
    const cx=(e.touches?e.touches[0].clientX:e.clientX)-r.left;
    const cy=(e.touches?e.touches[0].clientY:e.clientY)-r.top;
    return {x:cx,y:cy};
  };
  const down=e=>{e.preventDefault();sigDrawing=true;hideHint();const p=pos(e);sigCtx.beginPath();sigCtx.moveTo(p.x,p.y);};
  const move=e=>{if(!sigDrawing)return;e.preventDefault();const p=pos(e);sigCtx.lineTo(p.x,p.y);sigCtx.stroke();sigHasInk=true;};
  const up=()=>{sigDrawing=false;};
  cv.onmousedown=down; cv.onmousemove=move; window.onmouseup=up;
  cv.ontouchstart=down; cv.ontouchmove=move; cv.ontouchend=up;
}
function hideHint(){ const h=document.getElementById('sigHint'); if(h) h.style.display='none'; }
function clearSig(){ if(!sigCtx)return; const cv=document.getElementById('sigCanvas');
  sigCtx.clearRect(0,0,cv.width,cv.height); sigHasInk=false; const h=document.getElementById('sigHint'); if(h)h.style.display='flex'; }
async function saveSig(id){
  if(!sigHasInk){ toast(t('sigFirst'),'err'); return; }
  const cv=document.getElementById('sigCanvas');
  const data=cv.toDataURL('image/png');
  await dbUpdate('bookings',id,{signature:data,status:'signed'});
  closeModal(); renderMyBookings();
  toast(t('sigSaved'),'ok');
}

      <thead><tr><th>${t('date')}</th><th>${t('time')}</th><th>${t('actions')}</th></tr></thead>
      <tbody>${blocks.map(b=>`<tr><td>${b.date}</td><td>${b.time?b.time:('<span class=\"chip\">'+t('whole')+'</span>')}</td>
        <td><button class="btn btn-danger btn-sm" onclick="delBlock('${b.id}')">${t('unblock')}</button></td></tr>`).join('')}</tbody>
    </table></div>` : `<div class="empty-state">${t('noBlocks')}</div>`}
  </div>`;
}
async function addBlock(){
  const d=val('blkDate'), tm=val('blkTime');
  if(!d){ toast(t('blockDate'),'err'); return; }
  if(STORE.blocks.some(b=>b.date===d && (b.time||'')===(tm||''))){ toast('✓','ok'); return; }
  await dbInsert('blocks',{id:uid(),date:d,time:tm||null,created_at:now()});
  renderAdminTab(); toast(t('blockAdded'),'ok');
}
async function delBlock(id){ await dbDelete('blocks',id); renderAdminTab(); toast('✓','ok'); }

/* ----- admin: export ----- */
function adminExport(){
  const opts=['<option value="__all__">'+t('exportAll')+'</option>']
    .concat(STORE.clients.map(c=>`<option value="${c.id}">${esc(c.name)} (${esc(c.username)})</option>`));
  return `
  <div class="panel"><h2>📤 ${t('exportTitle')}</h2>
    <div class="grid2">
      <div class="field"><label>${t('exportClient')}</label><select id="exClient">${opts.join('')}</select></div>
      <div></div>
      <div class="field"><label>${t('fromDate')}</label><input type="date" id="exFrom"/></div>
      <div class="field"><label>${t('toDate')}</label><input type="date" id="exTo"/></div>
    </div>
    <div style="display:flex;gap:10px;flex-wrap:wrap">
      <button class="btn btn-ghost" onclick="exportCSV()">📄 ${t('exportCsv')}</button>
      <button class="btn btn-primary" onclick="exportReport()">🖨️ ${t('exportReport')}</button>
    </div>
    <p class="mini" style="margin-top:12px">${LANG==='zh'?'报告可在浏览器中打印或另存为 PDF，签名图像会一并包含。':'The report opens in a new tab — print it or Save as PDF. Signatures are included as images.'}</p>
  </div>`;
}
function exportFilter(){
  const cid=val('exClient'), from=val('exFrom'), to=val('exTo');
  return STORE.bookings.filter(b=>{
    if(cid!=='__all__' && b.client_id!==cid) return false;
    if(from && b.date<from) return false;
    if(to && b.date>to) return false;
    return true;
  }).sort((a,b)=>(a.date+a.time)<(b.date+b.time)?-1:1);
}
function exportCSV(){
  const rows=exportFilter();
  if(!rows.length){ toast(t('noData'),'err'); return; }
  const head=['Name','Date','Time','Duration(min)','Reason','Status','Signed','Created'];
  const lines=[head.join(',')].concat(rows.map(b=>[
    b.client_name,b.date,b.time,b.duration||60,`"${(b.reason||'').replace(/"/g,'""')}"`,
    b.status,(b.signature?'Yes':'No'),b.created_at
  ].join(',')));
  const blob=new Blob(['\ufeff'+lines.join('\n')],{type:'text/csv;charset=utf-8'});
  const url=URL.createObjectURL(blob); const a=document.createElement('a');
  a.href=url; a.download=`VCOP-bookings-${ymd(new Date())}.csv`; a.click(); URL.revokeObjectURL(url);
  toast('CSV ✓','ok');
}
function exportReport(){
  const rows=exportFilter();
  if(!rows.length){ toast(t('noData'),'err'); return; }
  const B=CONFIG.BUSINESS;
  const body=rows.map(b=>`
    <tr>
      <td>${esc(b.client_name)}</td><td>${b.date}</td><td>${b.time}</td>
      <td>${esc(b.reason)}</td><td>${b.signature?t('signed'):t('unsigned')}</td>
      <td>${b.signature?`<img src="${b.signature}" style="height:60px"/>`:'—'}</td>
    </tr>`).join('');
  const html=`<!DOCTYPE html><html><head><meta charset="utf-8"><title>VCOP Bookings Report</title>
    <style>body{font-family:Poppins,Arial,sans-serif;color:#13293D;padding:30px}
    h1{margin:0}.sub{color:#5B6570;margin:4px 0 20px}
    table{width:100%;border-collapse:collapse;font-size:13px}
    th{background:#13293D;color:#fff;padding:9px;text-align:left}
    td{border-bottom:1px solid #e6e9ed;padding:9px;vertical-align:middle}
    img{border:1px solid #e6e9ed;border-radius:6px;background:#fff}
    @media print{button{display:none}}</style></head>
    <body>
    <h1>VCOP · Appointments Report</h1>
    <div class="sub">${B.address} · ${B.phone} · Generated ${new Date().toLocaleString()}</div>
    <button onclick="window.print()" style="margin-bottom:16px;padding:10px 18px;background:#C08A2D;color:#fff;border:none;border-radius:8px;font-weight:600;cursor:pointer">Print / Save as PDF</button>
    <table><thead><tr><th>Name</th><th>Date</th><th>Time</th><th>Reason</th><th>Status</th><th>Signature</th></tr></thead>
    <tbody>${body}</tbody></table></body></html>`;
  const w=window.open('','_blank'); w.document.write(html); w.document.close();
  toast('Report ✓','ok');
}

/* ---------- 12. MODAL HELPERS ---------- */
function modal(inner,cls=''){
  const root=document.getElementById('modalRoot');
  root.innerHTML=`<div class="overlay" onclick="if(event.target===this)closeModal()"><div class="modal ${cls}" style="position:relative">${inner}</div></div>`;
}
function closeModal(){ document.getElementById('modalRoot').innerHTML=''; }
function val(id){ const e=document.getElementById(id); return e?e.value:''; }

/* ---------- 13. BOOT ---------- */
(async function(){ await initStorage(); render(); })();
</script>
