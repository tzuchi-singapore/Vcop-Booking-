<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>VCOP Job Booking App</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap');
:root{
  --navy:#13293D; --navy-700:#1c3a54; --navy-900:#0e2030;
  --amber:#C08A2D; --amber-600:#a8781f;
  --slate:#5B6570; --muted:#8a93a0;
  --paper:#F7F8FA; --card:#ffffff; --line:#E6E9ED; --line-2:#d7dce2;
  --ink:#13293D; --white:#fff;
  --danger:#C0392B; --success:#2E7D5B; --info:#2563a8;
  --shadow:0 10px 30px rgba(19,41,61,.10); --shadow-lg:0 24px 60px rgba(19,41,61,.18);
  --radius:16px; --radius-sm:11px;
  --font:'Poppins','Segoe UI',system-ui,-apple-system,Roboto,"Helvetica Neue",Arial,"PingFang SC","Microsoft YaHei",sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{font-family:var(--font);background:var(--paper);color:var(--ink);line-height:1.55;overflow-x:hidden}
img{max-width:100%;display:block}
button{font-family:inherit;cursor:pointer;border:none;background:none}
input,textarea,select{font-family:inherit;font-size:16px}
a{color:inherit;text-decoration:none}
.hidden{display:none !important}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:14px 22px;border-radius:12px;font-weight:600;font-size:15px;transition:.18s;border:1px solid transparent;white-space:nowrap}
.btn-primary{background:var(--amber);color:#fff;box-shadow:0 6px 18px rgba(192,138,45,.35)}
.btn-primary:hover{background:var(--amber-600);transform:translateY(-1px)}
.btn-navy{background:var(--navy);color:#fff}
.btn-navy:hover{background:var(--navy-700);transform:translateY(-1px)}
.btn-ghost{background:#fff;color:var(--navy);border:1px solid var(--line-2)}
.btn-ghost:hover{border-color:var(--navy)}
.btn-danger{background:#fff;color:var(--danger);border:1px solid #ecc7c3}
.btn-danger:hover{background:var(--danger);color:#fff}
.btn-success{background:var(--success);color:#fff}
.btn-block{width:100%}
.btn-sm{padding:9px 14px;font-size:13px;border-radius:9px}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none}

.topbar{position:sticky;top:0;z-index:50;background:rgba(255,255,255,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:12px 20px;gap:12px}
.brand{display:flex;align-items:center;gap:11px;min-width:0}
.brand-logo{height:38px;width:auto;display:block;cursor:pointer;-webkit-user-select:none;user-select:none}
.top-actions{display:flex;align-items:center;gap:8px}
.lang-toggle{display:flex;border:1px solid var(--line-2);border-radius:999px;overflow:hidden;background:#fff}
.lang-toggle button{padding:7px 13px;font-size:13px;font-weight:600;color:var(--slate)}
.lang-toggle button.active{background:var(--navy);color:#fff}

.wrap{max-width:1180px;margin:0 auto;padding:0 20px}
.view{min-height:calc(100vh - 60px)}
.section{padding:56px 0}
.eyebrow{color:var(--amber);font-weight:700;font-size:13px;letter-spacing:2px;margin:0 0 10px}
h1,h2,h3{color:var(--navy);margin:0}
.display{font-size:clamp(32px,5.5vw,56px);font-weight:800;line-height:1.05;letter-spacing:-1px}
.h2{font-size:clamp(24px,4vw,38px);font-weight:800;letter-spacing:-.5px}

.hero{position:relative;background:radial-gradient(1200px 500px at 80% -10%, rgba(192,138,45,.14), transparent 60%),linear-gradient(160deg,#fff 0%, #eef1f5 100%);overflow:hidden;border-bottom:1px solid var(--line)}
.hero.has-img{background:var(--navy-900)}
.hero-bg{position:absolute;inset:0;z-index:0;background-size:cover;background-position:center;opacity:.34}
.hero.has-img::after{content:"";position:absolute;inset:0;z-index:1;background:linear-gradient(100deg,rgba(14,32,48,.94) 30%,rgba(14,32,48,.6) 70%,rgba(14,32,48,.3))}
.hero-grid{position:relative;z-index:2;display:grid;grid-template-columns:1.15fr .85fr;gap:40px;align-items:center;padding:66px 0}
.hero.has-img .display,.hero.has-img .eyebrow{color:#fff}
.hero.has-img .eyebrow{color:var(--amber)}
.hero p.lead{font-size:18px;color:var(--slate);max-width:46ch;margin:18px 0 28px}
.hero.has-img p.lead{color:#cdd6df}
.hero-cta{display:flex;gap:12px;flex-wrap:wrap}
.hero-visual{position:relative;aspect-ratio:4/3;border-radius:24px;overflow:hidden;box-shadow:var(--shadow-lg);background:linear-gradient(135deg,var(--navy),var(--navy-900))}
.hero-visual img{width:100%;height:100%;object-fit:cover}
.hero-visual .grid-lines{position:absolute;inset:0;opacity:.5;background-image:linear-gradient(rgba(255,255,255,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.06) 1px,transparent 1px);background-size:44px 44px}
.hv-badge{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;color:#fff;text-align:center;padding:30px}
.hv-mark{width:92px;height:92px;border:6px solid #fff;border-radius:22px;position:relative}
.hv-mark::before{content:"";position:absolute;left:15px;bottom:15px;width:28px;height:28px;border-radius:7px;background:var(--amber)}
.hv-mark::after{content:"";position:absolute;right:15px;top:15px;width:28px;height:28px;border-radius:7px;background:#fff}
.hv-badge h3{color:#fff;font-size:23px}
.hv-badge span{color:#c8d2dc;font-size:12px;letter-spacing:2px}

.steps-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:30px}
.step{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:22px;position:relative}
.step .n{width:34px;height:34px;border-radius:9px;background:var(--navy);color:#fff;font-weight:700;display:flex;align-items:center;justify-content:center;margin-bottom:12px}
.step h3{font-size:16px;margin-bottom:5px}
.step p{margin:0;color:var(--slate);font-size:13.5px}

.about{background:var(--navy);color:#fff}
.about h2{color:#fff}.about .lead{color:#c3ccd6;max-width:62ch}
.about-facts{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:26px}
.fact{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.12);border-radius:14px;padding:16px}
.fact b{color:var(--amber);font-size:20px;display:block}.fact span{color:#c3ccd6;font-size:12.5px}

.contact-grid{display:grid;grid-template-columns:1fr 1fr;gap:26px;margin-top:28px}
.info-card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:24px}
.info-row{display:flex;gap:13px;align-items:flex-start;padding:11px 0;border-bottom:1px solid var(--line)}
.info-row:last-child{border-bottom:none}
.info-row .ic{width:36px;height:36px;flex:0 0 auto;border-radius:10px;background:rgba(192,138,45,.12);color:var(--amber);display:flex;align-items:center;justify-content:center;font-size:17px}
.info-row .lbl{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:1px}
.info-row .val{font-weight:600;color:var(--navy);font-size:14.5px}
.socials{display:flex;gap:10px;margin-top:16px}
.soc{width:42px;height:42px;border-radius:11px;display:flex;align-items:center;justify-content:center;background:var(--navy);color:#fff;font-weight:700;transition:.18s}
.soc:hover{background:var(--amber);transform:translateY(-2px)}
.map-card{border-radius:var(--radius);overflow:hidden;border:1px solid var(--line);min-height:320px;background:#e9edf1}
.map-card iframe{width:100%;height:100%;min-height:320px;border:0;display:block}
.footer{background:var(--navy-900);color:#aeb9c4;padding:30px 0;font-size:13px}
.footer .wrap{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;align-items:center}

.overlay{position:fixed;inset:0;background:rgba(14,32,48,.55);backdrop-filter:blur(3px);z-index:100;display:flex;align-items:center;justify-content:center;padding:18px}
.modal{background:#fff;border-radius:20px;box-shadow:var(--shadow-lg);width:100%;max-width:460px;padding:30px;max-height:92vh;overflow:auto;animation:pop .2s ease;position:relative}
.modal.wide{max-width:860px}
@keyframes pop{from{transform:scale(.96);opacity:0}to{transform:scale(1);opacity:1}}
.modal h2{font-size:22px;margin-bottom:4px}
.modal .sub{color:var(--slate);font-size:14px;margin-bottom:20px}
.field{margin-bottom:15px}
.field label{display:block;font-size:13px;font-weight:600;color:var(--navy);margin-bottom:6px}
.field input,.field textarea,.field select{width:100%;padding:12px 14px;border:1px solid var(--line-2);border-radius:11px;background:#fbfcfd;transition:.15s;color:var(--ink)}
.field input:focus,.field textarea:focus,.field select:focus{outline:none;border-color:var(--amber);background:#fff;box-shadow:0 0 0 3px rgba(192,138,45,.14)}
.field textarea{resize:vertical;min-height:72px}
.modal-x{position:absolute;top:16px;right:18px;font-size:26px;color:var(--muted);line-height:1;background:none;z-index:3}
.err{background:#fdece9;color:var(--danger);padding:10px 13px;border-radius:10px;font-size:13.5px;margin-bottom:14px;border:1px solid #f4ccc5}
.ok{background:#e8f5ee;color:var(--success);padding:10px 13px;border-radius:10px;font-size:13.5px;margin-bottom:14px;border:1px solid #bfe3cf}

.dash{padding:24px 0 70px}
.dash-head{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:20px}
.dash-head h1{font-size:25px}.dash-head .who{color:var(--slate);font-size:14px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:22px;margin-bottom:18px;box-shadow:var(--shadow)}
.panel h2{font-size:18px;margin-bottom:14px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px}
.mini{font-size:12px;color:var(--muted)}
.chip{display:inline-block;background:#eef1f5;color:var(--navy);border-radius:999px;padding:3px 10px;font-size:12px;font-weight:600}
.sechead{font-weight:700;color:var(--navy);margin:18px 0 10px;font-size:15px;border-left:3px solid var(--amber);padding-left:10px}

.cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.cal-head .mname{font-weight:700;font-size:17px;color:var(--navy)}
.cal-nav{display:flex;gap:8px}
.cal-nav button{width:36px;height:36px;border-radius:10px;border:1px solid var(--line-2);background:#fff;color:var(--navy);font-size:17px;font-weight:700}
.cal-nav button:hover{border-color:var(--navy)}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.cal-dow{text-align:center;font-size:11px;font-weight:700;color:var(--muted);padding:6px 0;text-transform:uppercase}
.cal-cell{aspect-ratio:1/1;border:1px solid var(--line);border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:600;color:var(--navy);cursor:pointer;position:relative;transition:.12s;font-size:15px;background:#fff}
.cal-cell:hover:not(.disabled):not(.blocked):not(.past){border-color:var(--amber);background:#fffdf8}
.cal-cell.empty{border:none;background:none;cursor:default}
.cal-cell.blocked{background:#fdeee6;color:#c98b6b;cursor:not-allowed;border-color:#f2d9cc}
.cal-cell.past{color:#c4ccd4;cursor:not-allowed;background:#fafbfc}
.cal-cell.today{border-color:var(--navy);border-width:2px}
.cal-cell.selected{background:var(--navy);color:#fff;border-color:var(--navy)}
.cal-cell .dot{width:6px;height:6px;border-radius:50%;background:var(--amber);position:absolute;bottom:6px}
.cal-cell.selected .dot{background:#fff}
.legend{display:flex;gap:16px;flex-wrap:wrap;margin-top:14px;font-size:12.5px;color:var(--slate)}
.legend i{width:12px;height:12px;border-radius:3px;display:inline-block;margin-right:5px;vertical-align:-1px}

.picker{display:flex;gap:10px;justify-content:center;align-items:center;margin:6px 0 4px}
.wheel{position:relative;width:92px;height:150px;overflow:hidden;border:1px solid var(--line-2);border-radius:14px;background:#fbfcfd}
.wheel .band{position:absolute;left:0;right:0;top:56px;height:38px;border-top:1px solid var(--amber);border-bottom:1px solid var(--amber);background:rgba(192,138,45,.07);pointer-events:none;z-index:1}
.wheel-scroll{position:absolute;inset:0;overflow-y:scroll;scroll-snap-type:y mandatory;scrollbar-width:none;text-align:center}
.wheel-scroll::-webkit-scrollbar{display:none}
.wheel-item{height:38px;line-height:38px;scroll-snap-align:center;font-size:20px;font-weight:600;color:var(--muted)}
.wheel-item.mid{color:var(--navy);font-size:23px}
.wheel-pad{height:56px}
.wheel-colon{font-size:26px;font-weight:800;color:var(--navy)}
.picked-time{text-align:center;font-size:14px;color:var(--slate);margin-top:6px}
.picked-time b{color:var(--navy);font-size:18px}

.jobcard{display:flex;gap:14px;align-items:center;padding:14px;border:1px solid var(--line);border-radius:13px;margin-bottom:10px;background:#fff;transition:.15s;cursor:pointer}
.jobcard:hover{border-color:var(--amber);box-shadow:var(--shadow)}
.jobcard .date-chip{flex:0 0 auto;width:58px;text-align:center;background:var(--navy);color:#fff;border-radius:10px;padding:8px 0}
.jobcard .date-chip b{display:block;font-size:19px;line-height:1}
.jobcard .date-chip span{font-size:10px;letter-spacing:1px;text-transform:uppercase}
.jobcard .jb-body{flex:1;min-width:0}
.jobcard .jb-body .t{font-weight:700;color:var(--navy);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.jobcard .jb-body .r{color:var(--slate);font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tag{font-size:11px;font-weight:700;padding:4px 9px;border-radius:999px;white-space:nowrap}
.tag-submitted{background:#fff4e0;color:#b8791a}
.tag-assigned{background:#e4effb;color:var(--info)}
.tag-completed{background:#e8f5ee;color:var(--success)}
.empty-state{text-align:center;color:var(--muted);padding:32px 10px;font-size:14px}

.po-table{width:100%;border-collapse:collapse;font-size:13px;margin-top:6px}
.po-table th{text-align:left;padding:7px 6px;color:var(--muted);font-size:11px;text-transform:uppercase;border-bottom:1px solid var(--line)}
.po-table td{padding:5px 5px;border-bottom:1px solid var(--line);vertical-align:top}
.po-table input{width:100%;padding:8px 8px;border:1px solid var(--line-2);border-radius:8px;font-size:13px;background:#fbfcfd}
.po-table .xbtn{color:var(--danger);font-size:18px;font-weight:700;padding:2px 8px}
.po-view{width:100%;border-collapse:collapse;font-size:12.5px;margin-top:4px}
.po-view th{background:var(--navy);color:#fff;padding:7px;text-align:left;font-size:11px}
.po-view td{border-bottom:1px solid var(--line);padding:7px;vertical-align:top}

.file-btn{display:flex;align-items:center;gap:9px;padding:14px 16px;border:2px dashed var(--amber);border-radius:12px;background:rgba(192,138,45,.06);color:var(--navy);font-size:14px;cursor:pointer;font-weight:600;transition:.15s}
.file-btn:hover{border-color:var(--amber-600);background:rgba(192,138,45,.12)}
.att-row{display:flex;align-items:center;gap:10px;padding:9px 12px;border:1px solid var(--line);border-radius:10px;margin-top:8px;background:#fff;font-size:13px}
.att-row .ic{font-size:18px}.att-row .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600;color:var(--navy)}
.att-row .xbtn{color:var(--danger);font-weight:700;font-size:16px;padding:0 6px}
.att-row .kind{font-size:11px}

.table{width:100%;border-collapse:collapse;font-size:13.5px}
.table th{text-align:left;padding:10px;color:var(--muted);font-size:11px;text-transform:uppercase;border-bottom:2px solid var(--line)}
.table td{padding:11px 10px;border-bottom:1px solid var(--line);color:var(--ink);vertical-align:middle}
.table tr:hover td{background:#fbfcfd}
.table-scroll{overflow-x:auto}
.tabs{display:flex;gap:6px;margin-bottom:18px;flex-wrap:wrap}
.tab{padding:10px 15px;border-radius:10px;font-weight:600;font-size:14px;color:var(--slate);background:#fff;border:1px solid var(--line)}
.tab.active{background:var(--navy);color:#fff;border-color:var(--navy)}

.sigwrap{border:2px dashed var(--line-2);border-radius:14px;background:#fff;position:relative;overflow:hidden}
.sigwrap canvas{width:100%;height:190px;display:block;touch-action:none;cursor:crosshair}
.sig-hint{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:14px;pointer-events:none}

.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(20px);opacity:0;background:var(--navy);color:#fff;padding:13px 20px;border-radius:12px;font-size:14px;font-weight:500;z-index:200;box-shadow:var(--shadow-lg);transition:.25s;max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.ok{background:var(--success)}.toast.err{background:var(--danger)}
.cfg-banner{background:#fff8ec;border-bottom:1px solid #f0e0c0;color:#8a6d2f;font-size:12.5px;padding:8px 16px;text-align:center}
.kv{display:flex;gap:10px;padding:7px 0;border-bottom:1px solid var(--line);font-size:14px}
.kv:last-child{border-bottom:none}
.kv .k{width:150px;flex:0 0 auto;color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.5px;padding-top:2px}
.kv .v{color:var(--navy);font-weight:500}

@media(max-width:860px){
  .hero-grid{grid-template-columns:1fr;gap:24px;padding:40px 0}
  .hero-visual{max-width:420px}
  .steps-grid{grid-template-columns:1fr}
  .contact-grid,.grid2,.grid3,.about-facts{grid-template-columns:1fr}
  .section{padding:44px 0}
  .kv{flex-direction:column;gap:2px}.kv .k{width:auto}
}
</style>
</head>
<body>
<div id="cfgBanner" class="cfg-banner hidden"></div>

let LANG="en";
const t=k=>(I18N[LANG][k] ?? I18N.en[k] ?? k);

/* ---------- storage ---------- */
let sb=null, CLOUD=false;
const STORE={requesters:[],jobs:[],blocks:[],resources:[]};
async function initStorage(){
  if(CONFIG.SUPABASE_URL && CONFIG.SUPABASE_ANON_KEY && window.supabase){
    try{
      sb=window.supabase.createClient(CONFIG.SUPABASE_URL,CONFIG.SUPABASE_ANON_KEY);
      const [r,j,b,s]=await Promise.all([
        sb.from('requesters').select('*'),
        sb.from('jobs').select('*'),
        sb.from('blocks').select('*'),
        sb.from('resources').select('*')
      ]);
      if(r.error||j.error) throw (r.error||j.error);
      STORE.requesters=r.data||[]; STORE.jobs=j.data||[];
      STORE.blocks=(b&&!b.error&&b.data)||[]; STORE.resources=(s&&!s.error&&s.data)||[];
      CLOUD=true;
    }catch(e){ console.warn("Supabase unavailable, demo mode:",e&&e.message); CLOUD=false; }
  }
  if(!CLOUD) seedDemo();
  else ensureResources();
  showCfgBanner();
}
function seedDemo(){
  STORE.requesters=[{id:uid(),username:"demo",password:"demo123",name:"Demo Requester",initials:"PM",phone:"+65 9000 0000",email:"demo@vcop.com.sg",created_at:now()}];
  STORE.resources=[
    ...CONFIG.DEFAULT_TEAMS.map(n=>({id:uid(),kind:'team',name:n})),
    ...CONFIG.DEFAULT_PMS.map(n=>({id:uid(),kind:'pm',name:n}))
  ];
}
async function ensureResources(){
  if(STORE.resources.length===0){
    for(const n of CONFIG.DEFAULT_TEAMS) await dbInsert('resources',{id:uid(),kind:'team',name:n});
    for(const n of CONFIG.DEFAULT_PMS) await dbInsert('resources',{id:uid(),kind:'pm',name:n});
  }
}
function showCfgBanner(){
  const el=document.getElementById('cfgBanner');
  if(!CLOUD){ el.classList.remove('hidden');
    el.innerHTML="Demo mode — data kept for this session only. Run the Supabase setup SQL to save permanently. &nbsp;·&nbsp; Demo requester: <b>demo / demo123</b>"; }
  else el.classList.add('hidden');
}
async function dbInsert(tbl,row){ STORE[tbl].push(row); if(CLOUD){const{error}=await sb.from(tbl).insert(row); if(error)console.warn(tbl,error);} }
async function dbUpdate(tbl,id,patch){ const r=STORE[tbl].find(x=>x.id===id); if(r)Object.assign(r,patch); if(CLOUD){const{error}=await sb.from(tbl).update(patch).eq('id',id); if(error)console.warn(tbl,error);} }
async function dbDelete(tbl,id){ STORE[tbl]=STORE[tbl].filter(x=>x.id!==id); if(CLOUD){const{error}=await sb.from(tbl).delete().eq('id',id); if(error)console.warn(tbl,error);} }
async function dbDeleteWhere(tbl,pred){ const d=STORE[tbl].filter(pred); STORE[tbl]=STORE[tbl].filter(x=>!pred(x)); if(CLOUD){for(const x of d)await sb.from(tbl).delete().eq('id',x.id);} }

// attachment upload: Supabase Storage when cloud, base64 fallback in demo
async function uploadAttachment(file,kind){
  if(CLOUD){
    try{
      const path=`jobs/${Date.now()}-${Math.random().toString(36).slice(2,8)}-${file.name.replace(/[^\w.\-]/g,'_')}`;
      const {error}=await sb.storage.from('attachments').upload(path,file,{upsert:false,contentType:file.type});
      if(error) throw error;
      const {data}=sb.storage.from('attachments').getPublicUrl(path);
      return {name:file.name,type:file.type,kind,url:data.publicUrl,path};
    }catch(e){ console.warn("storage upload failed, base64 fallback:",e&&e.message); }
  }
  const data=await fileToDataURL(file);
  return {name:file.name,type:file.type,kind,data};
}
function fileToDataURL(file){ return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(file);}); }

/* ---------- utils ---------- */
function uid(){return 'id-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,8);}
function now(){return new Date().toISOString();}
function pad(n){return String(n).padStart(2,'0');}
function ymd(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
function parseYMD(s){const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d);}
function fmtDateLong(s){ if(!s)return '—'; const d=parseYMD(s);
  const enM=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  const zhD=["日","一","二","三","四","五","六"];
  if(LANG==='zh')return `${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日 周${zhD[d.getDay()]}`;
  const enD=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
  return `${enD[d.getDay()]}, ${d.getDate()} ${enM[d.getMonth()]} ${d.getFullYear()}`; }
function toast(msg,type=''){const el=document.getElementById('toast');el.textContent=msg;el.className='toast show '+type;clearTimeout(el._t);el._t=setTimeout(()=>el.className='toast '+type,2800);}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));}
function minutesOf(hhmm){const[h,m]=hhmm.split(':').map(Number);return h*60+m;}
function val(id){const e=document.getElementById(id);return e?e.value:'';}
function teams(){return STORE.resources.filter(r=>r.kind==='team');}
function pms(){return STORE.resources.filter(r=>r.kind==='pm');}

}

function openAuth(){ if(SESSION.role)return;
  modal(`<button class="modal-x" onclick="closeModal()">×</button>
    <h2>${t('reqLogin')}</h2><p class="sub">${t('reqLoginSub')}</p>
    <div id="authErr"></div>
    <div class="field"><label>${t('username')}</label><input id="cu" autocomplete="username"/></div>
    <div class="field"><label>${t('password')}</label><input id="cp" type="password" autocomplete="current-password"/></div>
    <button class="btn btn-primary btn-block" onclick="reqLogin()">${t('signIn')}</button>`);
  setTimeout(()=>document.getElementById('cu')?.focus(),50);
}
function reqLogin(){
  const u=val('cu').trim(), p=val('cp');
  const r=STORE.requesters.find(x=>x.username.toLowerCase()===u.toLowerCase()&&x.password===p);
  if(!r){document.getElementById('authErr').innerHTML=`<div class="err">${t('badCreds')}</div>`;return;}
  SESSION={role:'requester',req:r}; closeModal(); render(); window.scrollTo(0,0);
}

/* ---------- calendar + time wheel (shared) ---------- */
let CAL={month:new Date().getMonth(),year:new Date().getFullYear(),selected:null,onPick:null,markFn:null};
let PICK={h:9,m:0};
function mountCalendar(mountId){
  const el=document.getElementById(mountId); if(!el)return;
  const first=new Date(CAL.year,CAL.month,1), startDow=first.getDay();
  const daysIn=new Date(CAL.year,CAL.month+1,0).getDate();
  const today=new Date(); today.setHours(0,0,0,0);
  const enM=["January","February","March","April","May","June","July","August","September","October","November","December"];
  const zhM=["1月","2月","3月","4月","5月","6月","7月","8月","9月","10月","11月","12月"];
  const mname=LANG==='zh'?`${CAL.year}年 ${zhM[CAL.month]}`:`${enM[CAL.month]} ${CAL.year}`;
  const dows=(LANG==='zh'?["日","一","二","三","四","五","六"]:["S","M","T","W","T","F","S"]);
  let cells='';
  for(let i=0;i<startDow;i++)cells+=`<div class="cal-cell empty"></div>`;
  for(let d=1;d<=daysIn;d++){
    const dateObj=new Date(CAL.year,CAL.month,d), ds=ymd(dateObj);
    const isPast=dateObj<today, isToday=ds===ymd(today);
    const wholeBlocked=STORE.blocks.some(b=>b.date===ds&&!b.time);
    const mark=CAL.markFn?CAL.markFn(ds):false;
    let cls='cal-cell'; if(isPast)cls+=' past'; else if(wholeBlocked)cls+=' blocked';
    if(isToday)cls+=' today'; if(CAL.selected===ds)cls+=' selected';
    const clickable=!isPast&&!wholeBlocked;
    cells+=`<div class="${cls}" ${clickable?`onclick="selectDate('${ds}','${mountId}')"`:''}>${d}${mark?'<span class="dot"></span>':''}</div>`;
  }
  el.innerHTML=`<div class="cal-head"><div class="mname">${mname}</div>
    <div class="cal-nav"><button onclick="calMove(-1,'${mountId}')">‹</button><button onclick="calMove(1,'${mountId}')">›</button></div></div>
    <div class="cal-grid">${dows.map(x=>`<div class="cal-dow">${x}</div>`).join('')}${cells}</div>`;
}
function calMove(dir,mountId){CAL.month+=dir;if(CAL.month<0){CAL.month=11;CAL.year--;}if(CAL.month>11){CAL.month=0;CAL.year++;}mountCalendar(mountId);}
function selectDate(ds,mountId){CAL.selected=ds;mountCalendar(mountId);if(CAL.onPick)CAL.onPick(ds);}
function mountTimeWheel(mountId){
  const el=document.getElementById(mountId); if(!el)return;
  const hours=[];for(let h=CONFIG.OPEN_HOUR;h<=CONFIG.CLOSE_HOUR;h++)hours.push(h);
  const mins=[0,15,30,45];
  el.innerHTML=`<div class="picker">
    <div class="wheel"><div class="band"></div><div class="wheel-scroll" id="wH"><div class="wheel-pad"></div>${hours.map(h=>`<div class="wheel-item" data-v="${h}">${pad(h)}</div>`).join('')}<div class="wheel-pad"></div></div></div>
    <div class="wheel-colon">:</div>
    <div class="wheel"><div class="band"></div><div class="wheel-scroll" id="wM"><div class="wheel-pad"></div>${mins.map(m=>`<div class="wheel-item" data-v="${m}">${pad(m)}</div>`).join('')}<div class="wheel-pad"></div></div></div>

  setupWheel('wH',v=>{PICK.h=+v;updatePicked();});

function setupWheel(id,onPick){const sc=document.getElementById(id);if(!sc)return;let tmr=null;

/* signature */
let sigCtx=null,sigDrawing=false,sigHasInk=false;
function setupSignature(j){
  const cv=document.getElementById('sigCanvas'); if(!cv)return;
  const wrap=document.getElementById('sigWrap'), ratio=window.devicePixelRatio||1, w=wrap.clientWidth, h=190;
  cv.width=w*ratio;cv.height=h*ratio;sigCtx=cv.getContext('2d');sigCtx.scale(ratio,ratio);
  sigCtx.lineWidth=2.4;sigCtx.lineCap='round';sigCtx.lineJoin='round';sigCtx.strokeStyle='#13293D';sigHasInk=false;
  const pos=e=>{const r=cv.getBoundingClientRect();return{x:(e.touches?e.touches[0].clientX:e.clientX)-r.left,y:(e.touches?e.touches[0].clientY:e.clientY)-r.top};};
  const down=e=>{e.preventDefault();sigDrawing=true;const hn=document.getElementById('sigHint');if(hn)hn.style.display='none';const p=pos(e);sigCtx.beginPath();sigCtx.moveTo(p.x,p.y);};
  const move=e=>{if(!sigDrawing)return;e.preventDefault();const p=pos(e);sigCtx.lineTo(p.x,p.y);sigCtx.stroke();sigHasInk=true;};
  const up=()=>{sigDrawing=false;};
  cv.onmousedown=down;cv.onmousemove=move;window.onmouseup=up;cv.ontouchstart=down;cv.ontouchmove=move;cv.ontouchend=up;
}
function clearSig(){if(!sigCtx)return;const cv=document.getElementById('sigCanvas');sigCtx.clearRect(0,0,cv.width,cv.height);sigHasInk=false;const h=document.getElementById('sigHint');if(h)h.style.display='flex';}
async function saveSig(id){
  if(!sigHasInk){toast(t('signFirst'),'err');return;}
  const data=document.getElementById('sigCanvas').toDataURL('image/png');
  await dbUpdate('jobs',id,{signature:data,status:'completed',signed_by:val('signBy').trim()});
  closeModal(); if(SESSION.role==='admin')renderAdminTab(); else renderMyJobs();
  toast(t('signSaved'),'ok');
}

function exportFilter(){
  const rid=val('exReq'),from=val('exFrom'),to=val('exTo'),st=val('exStatus');
  return STORE.jobs.filter(j=>{
    const d=j.scheduled_date||j.requested_date;
    if(rid!=='__all__'&&j.requester_id!==rid)return false;
    if(from&&d<from)return false; if(to&&d>to)return false;
    if(st&&j.status!==st)return false; return true;
  }).sort((a,b)=>((a.scheduled_date||a.requested_date)<(b.scheduled_date||b.requested_date))?-1:1);

  const lines=[head.join(',')];
  for(const j of rows){
    const pos=JSON.parse(j.pos||'[]').map(p=>`${p.supplier} ${p.po} ${p.items} x${p.qty}`).join(' | ');
    const atts=JSON.parse(j.attachments||'[]').map(a=>a.name).join(' | ');
    const row=[j.project_title,j.job_type,j.requester_name,j.requester_initials,j.project_address,j.site_contact,j.site_contact_no,j.requested_date,j.requested_time,j.scheduled_date,j.scheduled_time,j.assigned_pm,j.assigned_team,j.manpower,j.do_prep,j.return_goods,j.disposal,j.special_instructions,pos,atts,j.status,j.signed_by,j.signature?'Yes':'No']
      .map(x=>`"${String(x??'').replace(/"/g,'""')}"`).join(',');
    lines.push(row);
  }
  const blob=new Blob(['﻿'+lines.join('\n')],{type:'text/csv;charset=utf-8'}),u=URL.createObjectURL(blob),a=document.createElement('a');
  a.href=u;a.download=`VCOP-jobs-${ymd(new Date())}.csv`;a.click();URL.revokeObjectURL(u); toast('CSV ✓','ok');
}

      <tr><td>DO / Quotation</td><td>${esc(j.do_prep||'-')}</td><td>Return / Disposal</td><td>${esc(j.return_goods||'-')} / ${esc(j.disposal||'-')}</td></tr>
      <tr><td>Special</td><td colspan="3">${esc(j.special_instructions||'-')}</td></tr></table>
      ${pos.length?`<table class="pos"><tr><th>Supplier</th><th>PO</th><th>Items</th><th>Qty</th><th>Delivery</th><th>Remarks</th></tr>${pos.map(p=>`<tr><td>${esc(p.supplier)}</td><td>${esc(p.po)}</td><td>${esc(p.items)}</td><td>${esc(p.qty)}</td><td>${esc(p.deldate)}</td><td>${esc(p.remarks)}</td></tr>`).join('')}</table>`:''}
      ${atts.length?`<div class="att">Attachments: ${atts.map(a=>esc(a.name)+' ('+esc(a.kind)+')').join(', ')}</div>`:''}
      <div class="sign">Sign-off: ${j.signature?`<img src="${j.signature}"/> <span>${esc(j.signed_by||'')}</span>`:'<i>Not signed</i>'}</div>
    </div>`;}).join('');
  const html=`<!DOCTYPE html><html><head><meta charset="utf-8"><title>VCOP Jobs Report</title>
    <style>body{font-family:Poppins,Arial,sans-serif;color:#13293D;padding:28px;max-width:900px;margin:auto}
    h1{margin:0}.sub{color:#5B6570;margin:4px 0 20px}
    .job{border:1px solid #e6e9ed;border-radius:12px;padding:16px;margin-bottom:16px;page-break-inside:avoid}
    .jh{font-size:16px;margin-bottom:8px}.st{font-size:11px;padding:3px 9px;border-radius:999px;margin-left:8px}
    .st-submitted{background:#fff4e0;color:#b8791a}.st-assigned{background:#e4effb;color:#2563a8}.st-completed{background:#e8f5ee;color:#2E7D5B}
    table{border-collapse:collapse;width:100%;font-size:12px;margin:6px 0}
    .meta td{padding:4px 6px}.meta td:nth-child(odd){color:#8a93a0;width:14%}
    .pos th{background:#13293D;color:#fff;padding:5px;text-align:left}.pos td{border-bottom:1px solid #eee;padding:5px}
    .att{font-size:12px;color:#5B6570;margin:6px 0}
    .sign{margin-top:8px;font-size:12px;display:flex;align-items:center;gap:10px}.sign img{height:54px;border:1px solid #e6e9ed;border-radius:6px}
    @media print{button{display:none}}</style></head><body>
    <h1>VCOP · Job Booking Report</h1><div class="sub">${B.address} · ${B.phone} · Generated ${new Date().toLocaleString()}</div>
    <button onclick="window.print()" style="margin-bottom:16px;padding:10px 18px;background:#C08A2D;color:#fff;border:none;border-radius:8px;font-weight:600;cursor:pointer">Print / Save as PDF</button>
    ${body}</body></html>`;
  const w=window.open('','_blank'); w.document.write(html); w.document.close(); toast('Report ✓','ok');
}

/* ---------- modal helpers ---------- */
function modal(inner,cls=''){ document.getElementById('modalRoot').innerHTML=`<div class="overlay" onclick="if(event.target===this)closeModal()"><div class="modal ${cls}">${inner}</div></div>`; }
function closeModal(){ document.getElementById('modalRoot').innerHTML=''; }

/* ---------- boot ---------- */
(async function(){ await initStorage(); render(); })();
</script>
</body>
</html>
